name: shop_flow_e_commerce_mobile_app
description: "ShopFlow — a modern e-commerce mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Networking
  dio: ^5.9.0

  # UI
  google_fonts: ^6.3.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.0

  # Notifications
  flutter_local_notifications: ^19.0.0

  # Local storage
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# App icon — run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#5B4BF5"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

# Native splash — run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#5B4BF5"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#5B4BF5"
    image: assets/icon/splash_logo.png
    icon_background_color: "#5B4BF5"
  fullscreen: false

flutter:
  uses-material-design: true
